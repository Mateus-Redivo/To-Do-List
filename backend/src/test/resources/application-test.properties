# Test Database Configuration (Testcontainers MySQL)
# Testcontainers inicia um container MySQL real para testes
# As URLs serão fornecidas automaticamente pelo Testcontainers

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable initialization scripts during tests
spring.sql.init.mode=never

# Testcontainers reuse (opcional - acelera os testes)
testcontainers.reuse.enable=true
