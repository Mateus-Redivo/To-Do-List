# ==============================================================================
# Configuração do profile 'test'
#
# Ativado pela anotação @ActiveProfiles("test") nas classes de teste que sobem o
# contexto do Spring (TaskRepositoryTest e TodolistApiApplicationTests).
#
# Motivo de existir: sem este arquivo, os testes herdariam o datasource de
# src/main/resources/application.properties e tentariam se conectar ao MySQL de
# desenvolvimento em localhost:3406 — o que faz a suíte falhar sem Docker no ar e,
# pior, escrever no banco de desenvolvimento quando ele está no ar.
# ==============================================================================

# Banco em memória, recriado a cada execução da suíte.
# MODE=MySQL faz o H2 aceitar a sintaxe do MySQL, mantendo os testes fiéis ao banco real.
# DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a JVM de teste estiver rodando.
spring.datasource.url=jdbc:h2:mem:todolist_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema é gerado a partir das entidades e descartado ao fim da suíte.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Sem SQL no console: mantém a saída dos testes legível.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Não há schema.sql/data.sql neste projeto; desligado para não gerar ruído no log.
spring.sql.init.mode=never
