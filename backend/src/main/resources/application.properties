spring.application.name=todolist-api

# Server address options:
# localhost    - local development only
# 127.0.0.1   - local development / direct production access
# 0.0.0.0     - accessible from local network or externally
# server.address=localhost
# server.port=8080

# Data Source Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3406/todolist_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todolist_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todolist_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
# Use 'create' to recreate tables from scratch, then switch back to 'update'
spring.jpa.hibernate.ddl-auto=update

# Database initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# SQL logging — disable in production for performance
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

