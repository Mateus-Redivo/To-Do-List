name: TODO List CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-compose-up-and-test:
    name: Docker Compose & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create .env file
      run: |
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || 'test_root_password' }}" >> .env
        echo "MYSQL_DATABASE=todolist_db" >> .env
        echo "MYSQL_USER=todolist_user" >> .env
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD || 'test_password' }}" >> .env
        echo "SPRING_DATASOURCE_USERNAME=todolist_user" >> .env
        echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_PASSWORD || 'test_password' }}" >> .env
    
    - name: Start all services with Docker Compose
      run: docker-compose up -d --build
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting for backend to be healthy..."
        timeout 180s bash -c 'until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do echo "Waiting..."; sleep 5; done'
        echo "Backend is ready!"
    
    - name: Set up JDK 21 for tests
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run Java tests
      working-directory: ./backend
      run: ./mvnw test
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: backend/target/surefire-reports/
    
    - name: Show logs if failed
      if: failure()
      run: |
        echo "=== Backend logs ==="
        docker-compose logs backend
        echo "=== Database logs ==="
        docker-compose logs backend-db
    
    - name: Stop services
      if: always()
      run: docker-compose down -v
